<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns="http://www.w3.org/2000/svg"
   width="16px"
   height="16px"
   viewBox="0 0 16 16"
   version="1.1">
  <g>
    <!-- Верхний лист -->
    <rect
       x="4" y="0.5" width="8" height="4.5"
       style="fill:#ffffff;stroke:#000000;stroke-width:1" />
    <!-- Корпус принтера -->
    <rect
       x="1.5" y="4.5" width="13" height="6"
       rx="1"
       style="fill:#87aade;stroke:#000000;stroke-width:1" />
    <!-- Кнопка -->
    <rect
       x="11.5" y="6" width="2" height="1.6"
       style="fill:#ffffff;stroke:#000000;stroke-width:0.6" />
    <!-- Выходящий лист -->
    <rect
       x="4" y="9.5" width="8" height="6"
       style="fill:#ffffff;stroke:#000000;stroke-width:1" />
    <!-- Строки текста -->
    <line
       x1="6" y1="11.5" x2="10" y2="11.5"
       style="stroke:#000000;stroke-width:0.8" />
    <line
       x1="6" y1="13.5" x2="10" y2="13.5"
       style="stroke:#000000;stroke-width:0.8" />
  </g>
</svg>
